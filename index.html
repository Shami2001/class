 if(strong.length){const t=strong[0];L.forEach(x=>{if(near.length>=5||x===t||strong.includes(x)||near.includes(x))return;if(x.p===t.p&&x.p||lastP(x.p)===t.t)near.push(x)})}
 near=near.slice(0,5);
 return {strong,near,L}}

/* ---- اخیراً انتخاب‌شده‌ها ---- */
const RK='cls_gsrecent';let REC=[];try{REC=JSON.parse(localStorage.getItem(RK))||[]}catch(e){}
const keyOf=e=>e.t+'|'+e.p;
const remember=e=>{REC=[keyOf(e)].concat(REC.filter(x=>x!=keyOf(e))).slice(0,4);try{localStorage.setItem(RK,JSON.stringify(REC))}catch(x){}};

const GS={q:'',rows:[],act:-1};
const hl=(t,raw)=>{const q=String(raw||'').trim().replace(/ي/g,'ی').replace(/ك/g,'ک');if(!q)return esc(t);const i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))};
const box=()=>document.getElementById('gsr'),inpt=()=>document.getElementById('gsq'),wrap=()=>document.getElementById('gsb');

function gsRender(){const b=box();if(!b)return;const raw=GS.q,has=!!nz(raw);let h='';const rows=[];
 const add=(title,list)=>{if(!list.length)return;h+='<div class="gsh">'+title+'</div>';list.forEach(e=>{const i=rows.length;rows.push(e);h+='<div class="gsi" role="option" data-i="'+i+'" onclick="gsPick('+i+')" onmousemove="gsHov('+i+')"><span class="gsn">'+hl(e.t,raw)+'</span>'+(e.p?'<small class="gsp">'+esc(e.p)+'</small>':'')+'</div>'})};
 const L0=gsBuild().map(prep);
 const pref=()=>{const cur=v.c;const P=cur?['حضور و غیاب','چک\u200cلیست','تکلیف\u200cساز','آزمون\u200cساز','زمان\u200cسنج','دانش\u200cآموزان','تنظیمات']:['دوره\u200cها','دوره جدید','فراخوانی','تنظیمات'];const o=[];P.forEach(t=>{const e=L0.find(x=>x.t==t);if(e&&!o.includes(e))o.push(e)});return o};
 if(!has){const rec=REC.map(k=>L0.find(e=>keyOf(e)==k)).filter(Boolean);add('اخیراً',rec);add('پیشنهادها',pref().filter(e=>!rec.includes(e)).slice(0,7))}
 else{const r=gsFind(raw);
  if(r.strong.length){add('نتیجه\u200cها',r.strong);add('پیشنهادهای نزدیک',r.near)}
  else{h+='<div class="gse">موردی با «'+esc(raw.trim())+'» پیدا نشد.</div>';if(r.near.length)add('پیشنهادهای نزدیک',r.near);else add('شاید اینها را بخواهی',pref())}}
 b.innerHTML=h;GS.rows=rows;GS.act=has&&rows.length?0:-1;gsMark()}
function gsMark(){const b=box();if(!b)return;b.querySelectorAll('.gsi').forEach(x=>x.classList.toggle('act',+x.dataset.i==GS.act));const a=b.querySelector('.gsi.act');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest'})}
function gsOpen(){const b=box();if(b)b.classList.add('on')}
window.gsClose=()=>{const b=box();if(b)b.classList.remove('on')};
const xv=()=>{const w=wrap();if(w)w.classList.toggle('has',!!GS.q)};
window.gsIn=val=>{GS.q=val||'';xv();gsRender();gsOpen()};
window.gsFocus=sel=>{const i=inpt();if(!i)return;if(sel){i.focus();i.select()}gsRender();gsOpen()};
window.gsClear=()=>{const i=inpt();GS.q='';if(i){i.value='';i.focus()}xv();gsRender();gsOpen()};
window.gsHov=i=>{if(GS.act==i)return;GS.act=i;gsMark()};
window.gsPick=i=>{const e=GS.rows[i];if(!e)return;remember(e);const n=inpt();GS.q='';if(n){n.value='';n.blur()}xv();gsClose();try{e.run()}catch(x){console.error(x)}};
window.gsKey=e=>{if(e.isComposing)return false;const k=e.key;
 if(k=='Escape'){const i=inpt();gsClose();GS.q='';if(i){i.value='';i.blur()}xv();return true}
 if(k=='ArrowDown'||k=='ArrowUp'){e.preventDefault();const b=box();if(b&&!b.classList.contains('on')){gsRender();gsOpen()}const n=GS.rows.length;if(n)GS.act=k=='ArrowDown'?(GS.act+1)%n:(GS.act<=0?n-1:GS.act-1);gsMark();return true}
 if(k=='Enter'){e.preventDefault();if(GS.act>=0)gsPick(GS.act);else if(GS.q.trim()&&GS.rows.length)gsPick(0);return true}
 if(k=='Tab'){gsClose();return false}
 return false};
